<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intelligent Task & Media Processing Pipeline</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 15px;
        }

        .task-card {
            background: #f8fafc;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .task-card h2 {
            margin-bottom: 12px;
        }

        .task-info {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            background: #e8eef7;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .upload-box {
            border: 2px dashed #b8c2d1;
            border-radius: 14px;
            padding: 35px 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-box h3 {
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Intelligent Task & Media Processing Pipeline</h1>
            <p>Upload and process media files for your task</p>
        </div>


        <div class="task-card">
            <h2>📋 Task 1</h2>

            <p><strong>Study Python</strong></p>

            <br>

            <div class="task-info">
                <span class="tag">Priority: High</span>
                <span class="tag">Status: Pending</span>
            </div>
        </div>


        <form action="/tasks/1/upload"
              method="POST"
              enctype="multipart/form-data">

            <div class="upload-box">

                <h3>📁 Upload Media</h3>

                <p>
                    Select an image or other media file from your computer
                </p>

                <input type="file"
                       name="file"
                       required>

            </div>

            <button type="submit">
                Upload & Process
            </button>

        </form>


        <div class="footer">
            Intelligent Task & Media Processing Pipeline
        </div>

    </div>

</body>
</html>
